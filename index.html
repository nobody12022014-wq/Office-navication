<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사무실 길찾기 (1단계)</title>
<style>
:root{--bg:#f6f7f9;--fg:#1a1d21;--card:#fff;--line:#d9dde3;--ac:#1e63e9;--ac2:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--fg:#eceef2;--card:#1f2228;--line:#343841;--ac:#5b9bff;--ac2:#ff6b70}}
:root[data-theme="dark"]{--bg:#14161a;--fg:#eceef2;--card:#1f2228;--line:#343841;--ac:#5b9bff;--ac2:#ff6b70}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;display:flex;flex-direction:column;overflow:hidden}
#top{padding:8px;background:var(--card);border-bottom:1px solid var(--line);position:relative;z-index:5}
#q{width:100%;box-sizing:border-box;padding:10px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
#res{display:none;position:absolute;left:8px;right:8px;top:54px;background:var(--card);border:1px solid var(--line);border-radius:8px;max-height:40vh;overflow:auto;box-shadow:0 6px 20px #0004}
#res button{display:block;width:100%;text-align:left;padding:10px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--fg);font-size:15px}
#btns{display:flex;gap:6px;margin-top:8px}
#btns button{flex:1;padding:9px 2px;font-size:12px;border:1px solid var(--ac);border-radius:8px;background:none;color:var(--ac);font-weight:600}
#btns button.on{background:var(--ac);color:#fff}
#map{flex:1;position:relative;overflow:hidden;touch-action:none;background:#dfe3e8}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#img{display:block;max-width:none;user-select:none;-webkit-user-drag:none}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#hint{position:absolute;left:8px;right:8px;top:8px;background:#000c;color:#fff;padding:8px 10px;border-radius:8px;font-size:13px;display:none}
#panel{display:flex;gap:12px;align-items:center;padding:10px 14px;background:var(--card);border-top:1px solid var(--line)}
#arrow{flex:none;transition:transform .15s}
#t1{font-weight:700}#t2{font-size:13px;opacity:.8}
</style></head><body>
<div id="top"><input id="q" placeholder="목적지 검색 (예: PH-4 안전, 회의실 3, 설계)" autocomplete="off"><div id="res"></div>
<div id="btns"><button id="b1">① 출발</button><button id="b2">② 도착</button><button id="b3">③ 방향</button><button id="b4">🧭</button><button id="b5">↺ 초기화</button></div></div>
